<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Paper reader</title>
<style>
:root{color-scheme:light;--paper:#f8f7f3;--surface:#fffefa;--ink:#242d2b;--muted:#66736e;--line:#dedfd7;--accent:#266653;--tint:#e8f0e9;--warn:#956135;--serif:Georgia,'Noto Serif CJK SC','Songti SC',serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 var(--sans)}button,input,textarea,select{font:inherit}button,select{cursor:pointer}button{background:transparent;border:1px solid var(--line);border-radius:6px;color:inherit;padding:.48rem .8rem;transition:background .15s,border-color .15s}button:hover,button:focus-visible{background:var(--tint);border-color:var(--accent)}a{color:var(--accent);text-underline-offset:3px}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#194b3b;color:white}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 24px;border-right:1px solid var(--line)}.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}.brand b{display:inline-grid;place-items:center;width:25px;height:25px;border:1px solid var(--accent);margin-right:9px;border-radius:50%;font-size:13px;letter-spacing:0}.side-heading{font-size:12px;letter-spacing:.05em;color:var(--muted);margin:35px 0 12px}.index-list{list-style:none;padding:0;margin:0}.index-list button{width:100%;text-align:start;border:0;border-radius:0;padding:12px 9px;display:flex;gap:12px;border-left:2px solid transparent;line-height:1.5}.index-list button.active{background:var(--tint);border-left-color:var(--accent)}.ordinal{font:13px/1.8 var(--sans);color:var(--muted);flex:0 0 19px}.nav-title{font-size:14px;display:block}.status{font-size:11px;color:var(--muted);display:block;margin-top:5px}.status.missing{color:var(--warn)}.route{display:flex;gap:8px;flex-wrap:wrap}.route button{font-size:12px;padding:4px 9px}.side-footer{font-size:12px;color:var(--muted);margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}main{min-width:0;padding:24px 48px 70px;max-width:1260px;width:100%;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;font-size:13px}.toolbar-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar label{color:var(--muted)}select{background:var(--surface);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:6px 24px 6px 9px;max-width:100%}.paper-header{padding:32px 0 30px}.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.paper-title{font:500 clamp(22px,2.5vw,34px)/1.3 var(--serif);max-width:1000px;margin:12px 0 14px;overflow-wrap:anywhere}.paper-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:36px;border-top:1px solid var(--line);padding-top:30px}.unit-top{display:flex;align-items:center;gap:12px}.unit-num{font:32px/1 var(--serif);color:var(--accent)}.unit-title{font-size:24px;line-height:1.4;font-weight:600;margin:12px 0 10px}.section-origin{font-size:12px;color:var(--muted);margin-bottom:20px}.level-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0 24px}.level-tabs button{font-size:12px;padding:5px 9px}.level-tabs button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.lesson{font-size:16px;line-height:1.95;overflow-wrap:anywhere}.lesson h2,.lesson h3{font-size:19px;line-height:1.5;margin:28px 0 12px}.lesson h4{font-size:16px}.lesson p{margin:0 0 18px}.lesson figure{margin:26px 0}.lesson img{width:100%;height:auto;display:block;background:white;cursor:zoom-in}.lesson figcaption{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}.lesson blockquote{margin:22px 0;padding:8px 20px;border-left:3px solid var(--accent);background:var(--tint)}.lesson table{width:100%;border-collapse:collapse;font-size:14px}.lesson td,.lesson th{padding:9px;border-bottom:1px solid var(--line);text-align:start}.lesson pre{white-space:pre-wrap;background:var(--tint);padding:14px;overflow:auto}.lesson svg{max-width:100%;height:auto}.lesson details{border-top:1px solid var(--line);padding:12px 0}.lesson summary{cursor:pointer;font-weight:600}.lesson [data-stepper]{margin:20px 0}.lesson [data-stepper] button{margin:0 6px 10px 0;font-size:13px}.lesson [hidden]{display:none!important}.empty{padding:26px 0;color:var(--muted)}.notice{font-size:13px;color:var(--warn);border-left:2px solid var(--warn);padding:8px 12px;margin:18px 0}.context h3{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 14px}.context section+section{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}.term{border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.term summary{font-weight:600;cursor:pointer}.term p{color:var(--muted);margin:8px 0}.source-item{font-size:12px;margin:0 0 20px}.source-item strong{display:block;font-size:13px}.source-item p{color:var(--muted);margin:4px 0}.source-item img{width:100%;max-height:190px;object-fit:contain;background:white;margin:8px 0;cursor:zoom-in}.source-item button{font-size:11px;padding:3px 7px}.continue{border-top:1px solid var(--line);margin-top:30px;padding-top:22px}.continue label{display:block;font-size:13px;margin-bottom:8px}.continue textarea{display:block;resize:vertical;width:100%;min-height:82px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px;border-radius:6px;font-size:14px}.continue button{margin-top:12px;font-size:14px}.footnote{margin-top:35px;font-size:11px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:26px;width:min(720px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#172b2666}dialog h2{font-size:21px;margin:0 0 10px}dialog p{font-size:13px;color:var(--muted)}dialog textarea{width:100%;height:300px;padding:12px;font:13px/1.7 var(--sans);border:1px solid var(--line);background:white;resize:vertical;color:var(--ink)}.dialog-actions{display:flex;justify-content:space-between;gap:12px;margin-top:15px}#image-dialog{width:min(1200px,96vw)}#image-dialog img{width:100%;height:auto}#copy-status{min-height:24px}.mobile-index{display:none}
@media(min-width:1500px){main{padding-inline:60px}.workspace{grid-template-columns:minmax(0,1fr) 270px;gap:48px}}
@media(max-width:1100px){.shell{grid-template-columns:225px minmax(0,1fr)}.sidebar{padding:24px 16px}main{padding:24px}.workspace{grid-template-columns:minmax(0,1fr)}.context{display:grid;grid-template-columns:1fr 1fr;gap:24px}.context section+section{border-top:0;padding-top:0;margin-top:0}}
@media(max-width:700px){.shell{display:block}.sidebar{position:relative;height:auto;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.sidebar .index-area{display:none}.sidebar.open .index-area{display:block}.mobile-index{display:block;position:absolute;right:18px;top:14px;font-size:12px}.side-footer{display:none}main{padding:18px}.paper-header{padding:24px 0}.toolbar{gap:14px}.toolbar-group{gap:7px}.toolbar button{font-size:12px}.workspace{padding-top:24px;gap:30px}.unit-title{font-size:22px}.context{display:block}.context section+section{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}.lesson{font-size:15px}.paper-title{font-size:24px}.level-tabs button{font-size:11px}dialog{padding:20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>K</b><span data-i18n="name"></span></div>
    <button class="mobile-index" id="mobile-index" data-i18n="index" aria-expanded="false"></button>
    <div class="index-area"><div class="side-heading" data-i18n="index"></div><ol class="index-list" id="index"></ol><div class="side-heading" data-i18n="route"></div><div class="route" id="route"></div></div>
    <div class="side-footer" data-i18n="evidenceNote"></div>
  </aside>
  <main>
    <div class="toolbar"><div class="toolbar-group"><label for="language" data-i18n="language"></label><select id="language"></select><button id="new-language" data-i18n="newLanguage"></button></div><button id="resume" data-i18n="resume"></button></div>
    <header class="paper-header"><div class="eyebrow" id="paper-eyebrow"></div><h1 class="paper-title" id="paper-title"></h1><div class="paper-meta" id="paper-meta"></div></header>
    <div class="workspace"><article id="unit"><div class="unit-top"><span class="unit-num" id="unit-num"></span><span class="status" id="unit-status"></span></div><h2 class="unit-title" id="unit-title"></h2><div class="section-origin" id="unit-origin"></div><div class="level-tabs" id="levels" role="group"></div><div id="unit-notice"></div><div class="lesson" id="lesson"></div><div class="continue"><label for="question" data-i18n="question"></label><textarea id="question"></textarea><button class="primary" id="ask"></button></div></article><aside class="context"><section><h3 data-i18n="glossary"></h3><div id="glossary"></div></section><section><h3 data-i18n="sources"></h3><div id="sources"></div></section></aside></div>
    <div class="footnote" data-i18n="notMastery"></div>
  </main>
</div>
<dialog id="prompt-dialog"><h2 data-i18n="promptTitle"></h2><p data-i18n="promptHelp"></p><textarea id="prompt-text" readonly></textarea><p id="copy-status" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="prompt-close" data-i18n="close"></button><button class="primary" id="copy" data-i18n="copy"></button></div></dialog>
<dialog id="image-dialog"><button id="image-close" data-i18n="close"></button><p id="image-caption"></p><img id="large-image" alt=""></dialog>
<script id="reader-data" type="application/json">__READER_PAYLOAD__</script>
<script>
'use strict';
const project=JSON.parse(document.getElementById('reader-data').textContent);
const $=id=>document.getElementById(id);
const element=(tag,text,className)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;};
let saved={};try{saved=JSON.parse(localStorage.getItem(project.project_id)||'{}');}catch{}
let lang=project.ui[saved.language]?saved.language:project.default_language;
let unitId=decodeURIComponent(location.hash.slice(1))||project.resume_unit||saved.unit||project.units[0]?.id;
if(!project.units.some(u=>u.id===unitId))unitId=project.units[0]?.id;
let selectedLevels=saved.levels||{};
const levels=['light','medium','deep'];
const t=key=>project.ui[lang][key];
const current=()=>project.units.find(u=>u.id===unitId);
const level=()=>levels.includes(selectedLevels[unitId])?selectedLevels[unitId]:project.default_level;
const title=u=>u?.titles[lang]||u?.id||'';
function remember(){try{localStorage.setItem(project.project_id,JSON.stringify({language:lang,unit:unitId,levels:selectedLevels}));}catch{}}
function link(text,url){const a=element('a',text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;}
function sourceLink(source){const path=(source.data_uri&&source.page?(source.url||project.paper.source?.path):null)||source.path||source.url||project.paper.source?.path;return path?path+(source.page?'#page='+source.page:''):undefined;}
function imageView(src,label){$('large-image').src=src;$('large-image').alt=label;$('image-caption').textContent=label;$('image-dialog').showModal();}
function localize(){document.documentElement.lang=lang;document.documentElement.dir=/^(ar|he|fa|ur)(-|$)/i.test(lang)?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('question').placeholder=t('questionPlaceholder');$('prompt-text').setAttribute('aria-label',t('promptTitle'));$('levels').setAttribute('aria-label',t('level'));document.title=project.paper.title+' · '+t('name');}
function render(){
 localize();remember();const unit=current();
 $('language').replaceChildren();Object.keys(project.ui).forEach(code=>{let name=code;try{name=new Intl.DisplayNames([code],{type:'language'}).of(code);}catch{}const opt=element('option',name);opt.value=code;opt.selected=code===lang;$('language').append(opt);});
 $('paper-title').textContent=project.paper.title;$('paper-eyebrow').textContent=t('name')+' / '+t('revision')+' '+project.revision;
 $('paper-meta').replaceChildren();if(project.paper.doi)$('paper-meta').append(link(project.paper.doi,'https://doi.org/'+project.paper.doi));if(project.paper.source)$('paper-meta').append(link(t('paper'),project.paper.source.path));
 $('index').replaceChildren();project.units.forEach((u,i)=>{const li=element('li');const b=element('button');b.type='button';b.className=u.id===unitId?'active':'';if(u.id===unitId)b.setAttribute('aria-current','page');b.append(element('span',String(i+1).padStart(2,'0'),'ordinal'));const texts=element('span');texts.append(element('span',title(u),'nav-title'),element('span',t(u.status),'status '+u.status));b.append(texts);b.onclick=()=>navigate(u.id);li.append(b);$('index').append(li);});
 $('route').replaceChildren();project.route.forEach(uid=>{const u=project.units.find(x=>x.id===uid);const b=element('button',String(project.units.indexOf(u)+1).padStart(2,'0'));b.title=title(u);b.onclick=()=>navigate(uid);$('route').append(b);});
 if(!unit){$('unit').hidden=true;$('sources').textContent=t('noUnits');return;}$('unit').hidden=false;
 $('unit-num').textContent=String(project.units.indexOf(unit)+1).padStart(2,'0');$('unit-title').textContent=title(unit);$('unit-status').textContent=t(unit.status);$('unit-status').className='status '+unit.status;
 $('unit-origin').textContent=unit.original_section?t('originalSection')+' · '+unit.original_section:'';
 $('levels').replaceChildren();levels.forEach(l=>{const b=element('button',t(l));b.type='button';b.dataset.level=l;b.setAttribute('aria-pressed',String(l===level()));b.onclick=()=>{selectedLevels[unitId]=l;render();};$('levels').append(b);});
 const content=unit.content[lang]?.[level()];$('lesson').innerHTML=content||'';if(!content)$('lesson').append(element('p',t('unavailable'),'empty'));
 $('ask').textContent=content?t('ask'):t('generate');$('unit-notice').replaceChildren();if(unit.status==='missing'||unit.source_ids.some(id=>project.sources.find(s=>s.id===id)?.status==='missing'))$('unit-notice').append(element('p',t('missingHelp'),'notice'));
 $('glossary').replaceChildren();const terms=project.glossary[lang]||[];if(!terms.length)$('glossary').append(element('p',t('noTerms'),'status'));terms.forEach(term=>{const d=element('details',undefined,'term');d.append(element('summary',term.term),element('p',term.definitions[level()]||t('termPending')));$('glossary').append(d);});
 $('sources').replaceChildren();unit.source_ids.forEach(id=>{const s=project.sources.find(x=>x.id===id);const row=element('div',undefined,'source-item');row.id='source-'+id;row.append(element('strong',s.label),element('p',s.locator));if(s.note)row.append(element('p',s.note));if(s.status==='missing')row.append(element('p',t('sourceMissingNote'),'notice'));else{if(s.data_uri){const image=element('img');image.src=s.data_uri;image.alt=s.label;image.onclick=()=>imageView(s.data_uri,s.label+' · '+s.locator);row.append(image);const enlarge=element('button',t('viewFigure'));enlarge.onclick=image.onclick;row.append(enlarge);}const href=sourceLink(s);if(href){row.append(element('br'),link(t('sourceLink'),href));}}$('sources').append(row);});
}
function navigate(id){unitId=id;history.replaceState(null,'','#'+id);$('question').value='';render();$('sidebar').classList.remove('open');$('mobile-index').setAttribute('aria-expanded','false');$('unit').scrollIntoView({block:'start',behavior:'auto'});}
function prompt(resume=false,extra=''){
 const values={paper:project.paper.title,doi:project.paper.doi||'—',project:project.project_id,bundle:project.bundle_path,revision:String(project.revision),unit:(unitId||'—')+' / '+title(current()),level:t(level()),language:lang,question:[$('question').value,extra].filter(Boolean).join('\n')||'—'};
 const text=t(resume?'prompt_resume':'prompt_unit').replace(/\{(\w+)\}/g,(_,key)=>values[key]??'');
 $('prompt-text').value=text;$('copy-status').textContent='';$('prompt-dialog').showModal();
}
$('language').onchange=e=>{lang=e.target.value;render();};$('ask').onclick=()=>prompt();$('resume').onclick=()=>prompt(true);
$('new-language').onclick=()=>{const desired=window.prompt(t('languageQuestion'));if(desired?.trim())prompt(false,t('languageRequest').replace('{language}',desired.trim()));};
$('copy').onclick=async()=>{try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText($('prompt-text').value);$('copy-status').textContent=t('copied');}catch{$('prompt-text').focus();$('prompt-text').select();$('copy-status').textContent=t('manual');}};
$('prompt-close').onclick=()=>$('prompt-dialog').close();$('image-close').onclick=()=>$('image-dialog').close();
$('mobile-index').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('mobile-index').setAttribute('aria-expanded',String(open));};
$('lesson').onclick=e=>{const image=e.target.closest('img');if(image){imageView(image.src,image.alt);return;}const trigger=e.target.closest('[data-show]');if(trigger){const scope=trigger.closest('[data-stepper]');if(scope){scope.querySelectorAll('[data-step]').forEach(step=>step.hidden=step.dataset.step!==trigger.dataset.show);scope.querySelectorAll('[data-show]').forEach(b=>b.setAttribute('aria-pressed',String(b===trigger)));}}};
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(project.units.some(u=>u.id===id)){unitId=id;render();}});
render();
</script>
</body>
</html>
